<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Rosati's Prep — STC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8192A; --red-dk:#9E1220;
  --green:#2E7D46; --green-dk:#1B5C2E;
  --gold:#D4A017; --gold-lt:#E8B93A;
  --cream:#F5EDD8;
  --bg:#171310; --bg2:#221C17; --card:#2A231D; --card2:#332A22;
  --line:#3E342A; --line2:#4A3E31;
  --txt:#F5EDD8; --txt2:#B8AB93; --txt3:#8A7D66;
  --gray:#6B6155;
  --r:14px;
  --font-d:'Anton','Arial Narrow',Impact,sans-serif;
  --font-b:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font-b);font-size:17px;line-height:1.35;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font-b);font-size:18px;background:var(--bg2);border:1.5px solid var(--line2);color:var(--txt);border-radius:10px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
label{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin:14px 0 5px;font-weight:600}
h1,h2,h3{font-family:var(--font-d);font-weight:400;letter-spacing:.02em}
.screen{flex:1;padding:18px 16px calc(96px + env(safe-area-inset-bottom));overflow-y:auto}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.brandline{display:flex;align-items:center;gap:10px}
.brandmark{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-family:var(--font-d);font-size:19px;color:#fff}
.topbar h1{font-size:21px;text-transform:uppercase}
.topbar .sub{font-size:13px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}
.iconbtn{width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(23,19,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt3);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
#nav button .ic{font-size:21px;line-height:1}
#nav button.on{color:var(--gold-lt)}
#nav .badge{position:absolute;top:5px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.prepcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px}
.prepcard.p-critical{border-left-color:var(--red)}
.prepcard.p-high{border-left-color:var(--gold)}
.prepcard.s-done{border-left-color:var(--green)}
.prepcard.s-done .pc-nums{opacity:.85}
.prepcard.s-progress{border-left-color:var(--gold-lt);background:var(--card2)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc-name{font-family:var(--font-d);font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.pc-meta{font-size:14px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.gray{background:#3a332b;color:var(--txt2)}
.pill.yellow{background:rgba(212,160,23,.18);color:var(--gold-lt)}
.pill.green{background:rgba(46,125,70,.22);color:#6FCB8A}
.pill.red{background:rgba(200,25,42,.2);color:#FF7A87}
/* PAR | ON HAND (input) | MAKE */
.pc-nums{display:flex;align-items:stretch;margin:12px 0 10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pc-num{flex:1;padding:9px 6px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.pc-num+.pc-num{border-left:1px solid var(--line)}
.pc-num .k{font-size:11.5px;letter-spacing:.14em;color:var(--txt3);text-transform:uppercase;font-weight:600}
.pc-num .v{font-family:var(--font-d);font-size:24px;margin-top:1px}
.pc-num .u{font-size:12px;color:var(--txt3)}
.onhand{width:76px;margin:3px auto 0;text-align:center;font-family:var(--font-d);font-size:22px;padding:6px 4px;border-radius:9px;background:var(--card);border:1.5px dashed var(--line2)}
.onhand:focus{border-style:solid}
.onhand.empty{border-color:var(--gold);background:rgba(212,160,23,.07)}
.pc-num.make{flex:1.25;background:linear-gradient(160deg,rgba(212,160,23,.22),rgba(212,160,23,.08));position:relative}
.pc-num.make .v{font-size:38px;color:var(--gold-lt);text-shadow:0 2px 12px rgba(212,160,23,.35)}
.pc-num.make.zero{background:rgba(46,125,70,.12)}
.pc-num.make.zero .v{color:#6FCB8A;font-size:26px;text-shadow:none}
.pc-num.make.uncounted .v{color:var(--txt3);font-size:15px;text-shadow:none}
.pc-num.make.nopar .v{color:var(--txt3);font-size:15px;text-shadow:none}
.batchline{font-size:15px;color:var(--txt2);background:rgba(212,160,23,.08);border:1px dashed rgba(212,160,23,.4);border-radius:9px;padding:7px 10px;margin-bottom:10px}
.batchline b{color:var(--gold-lt)}
.pc-actions{display:flex;gap:8px}
.btn{flex:1;padding:14px 10px;border-radius:11px;font-size:16.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.btn.primary{background:var(--red);color:#fff}
.btn.go{background:var(--green);color:#fff}
.btn.ghost{background:var(--card2);color:var(--txt2);border:1px solid var(--line2)}
.btn.gold{background:var(--gold);color:#241c07}
.btn.sm{flex:none;padding:10px 14px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.assignchip{font-size:14.5px;color:var(--txt2);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.assignchip.me{border-color:var(--gold);color:var(--gold-lt)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;letter-spacing:.05em;color:var(--txt2);text-transform:uppercase}
.chip.on{background:var(--cream);color:#241c07;border-color:var(--cream)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.stat .v{font-family:var(--font-d);font-size:27px}
.stat .k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:600;margin-top:2px}
.stat.red .v{color:#FF7A87}.stat.green .v{color:#6FCB8A}.stat.gold .v{color:var(--gold-lt)}
.progressbar{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden;margin:8px 0 4px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-dk),var(--green))}
.sechead{font-family:var(--font-d);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.sechead:after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .t{font-weight:600;font-size:17px}
.row .s{font-size:14px;color:var(--txt3)}
.row .r{text-align:right;font-family:var(--font-d);font-size:19px}
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;text-transform:uppercase;margin-bottom:2px}
.sheet .sub{color:var(--txt3);font-size:15px;margin-bottom:8px}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.optgrid .opt{padding:13px 8px;border-radius:10px;background:var(--card);border:1.5px solid var(--line2);font-size:16px;font-weight:600;text-align:center}
.optgrid .opt.on{border-color:var(--gold);background:rgba(212,160,23,.12);color:var(--gold-lt)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px}
.stepper button{width:56px;height:56px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-size:26px;font-weight:700}
.stepper input{text-align:center;font-family:var(--font-d);font-size:28px;height:56px}
.dayparsgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dayparsgrid .dp{text-align:center}
.dayparsgrid .dp span{display:block;font-size:11px;color:var(--txt3);letter-spacing:.08em;margin-bottom:3px;text-transform:uppercase}
.dayparsgrid input{padding:8px 2px;text-align:center;font-size:16px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
.logo-lockup{text-align:center;margin-bottom:26px}
.logo-lockup .mark{width:66px;height:66px;margin:0 auto 12px;border-radius:16px;background:var(--red);display:grid;place-items:center;font-family:var(--font-d);font-size:38px;color:#fff;box-shadow:0 8px 30px rgba(200,25,42,.35)}
.logo-lockup h1{font-size:30px;text-transform:uppercase}
.logo-lockup p{color:var(--txt3);letter-spacing:.22em;text-transform:uppercase;font-size:13px;margin-top:4px}
.usergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.usercard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center}
.usercard .av{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-family:var(--font-d);font-size:20px;background:var(--card2);border:1px solid var(--line2)}
.usercard.role-admin .av{background:rgba(200,25,42,.2);color:#FF8B96}
.usercard.role-manager .av{background:rgba(212,160,23,.18);color:var(--gold-lt)}
.usercard.role-employee .av{background:rgba(46,125,70,.18);color:#6FCB8A}
.usercard .nm{font-weight:700;font-size:17px}
.usercard .rl{font-size:12.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:14px auto 0}
.pinpad button{height:64px;border-radius:14px;background:var(--card);border:1px solid var(--line2);font-family:var(--font-d);font-size:24px}
.pindots{display:flex;justify-content:center;gap:14px;margin:16px 0 4px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.pindots i.f{background:var(--gold);border-color:var(--gold)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.alertcard{border-left:5px solid var(--red)}
.notice{font-size:14.5px;color:var(--txt3);text-align:center;padding:26px 10px}
.demo-tag{font-size:10.5px;letter-spacing:.1em;background:var(--bg2);border:1px solid var(--line);color:var(--txt3);border-radius:5px;padding:2px 6px;text-transform:uppercase;vertical-align:2px;margin-left:6px}
.linklike{color:var(--gold-lt);font-weight:600;text-decoration:underline}
.table{width:100%;border-collapse:collapse;font-size:15.5px}
.table th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2)}
.table td{padding:9px 6px;border-bottom:1px solid var(--line)}
.table td.n{font-family:var(--font-d);font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));background:var(--cream);color:#241c07;font-weight:700;padding:12px 20px;border-radius:99px;z-index:60;font-size:16px;box-shadow:0 8px 26px rgba(0,0,0,.5);white-space:nowrap;animation:up .18s ease-out}
.warnbox{background:rgba(200,25,42,.1);border:1px solid rgba(200,25,42,.4);border-radius:11px;padding:11px 13px;font-size:15.5px;margin-bottom:12px}
.okbox{background:rgba(46,125,70,.12);border:1px solid rgba(46,125,70,.4);border-radius:11px;padding:11px 13px;font-size:15.5px;margin-bottom:12px}
.holidaybanner{background:linear-gradient(120deg,rgba(200,25,42,.25),rgba(212,160,23,.2));border:1px solid rgba(212,160,23,.5);border-radius:var(--r);padding:13px 15px;margin-bottom:12px}
.holidaybanner b{font-family:var(--font-d);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.holidaybanner .s{font-size:15px;color:var(--txt2);margin-top:2px}
</style>
</head>

const STORE_KEY='rosatis-par-v2';

const FS_DOC='https://firestore.googleapis.com/v1/projects/rosatis-prep/databases/(default)/documents/stores/stc/app/state';

async function backendGet(){
  try{

    if(r.status===404){fsOnline=true;return localGet();} /* cloud empty (first ever run) */
    if(!r.ok)throw new Error('fs read '+r.status);

    const j=d.fields&&d.fields.json&&d.fields.json.stringValue;
    if(j){const loc=localGet();
      /* prefer whichever is newer so an offline phone doesn't lose its work */
      try{const rj=JSON.parse(j),lj=loc?JSON.parse(loc):null;
        if(lj&&(lj.rev||0)>(rj.rev||0))return loc;}catch(e){}
      localSet(j);return j;}
    return localGet();
  }catch(e){fsOnline=false;return localGet();}
}
async function backendSet(str){
  localSet(str); /* cache locally first — instant boot, offline safety */
  const body=JSON.stringify({fields:{
    json:{stringValue:str},

    updatedAt:{stringValue:S.updatedAt||''}}});
  const r=await fetch(FS_DOC+'?key='+FS_KEY,{method:'PATCH',headers:{'Content-Type':'application/json'},body});

function packState(){

function holidayFor(k){
  const [y,m,d]=k.split('-').map(Number);
  for(const h of S.holidays){
    if(h.type==='fixed'&&h.m===m&&h.d===d)return h;
    if(h.type==='float'){const dt=floatDate(y,h.key);if(dt&&ymd(dt)===k)return h;}
    if(h.type==='date'&&h.date===k)return h;
  }
  return null;
}
/* learn multiplier for a holiday from sales history: holiday sales / weekday avg */
function learnedMult(h){
  const dates=Object.keys(S.sales);
  const hits=[];
  dates.forEach(k=>{const [y,m,d]=k.split('-').map(Number);
    let match=false;
    if(h.type==='fixed'&&h.m===m&&h.d===d)match=true;
    if(h.type==='float'){const dt=floatDate(y,h.key);if(dt&&ymd(dt)===k)match=true;}
    if(h.type==='date'&&h.date===k)match=true;
    if(match)hits.push(k);
  });
  if(!hits.length)return null;
  const ratios=hits.map(k=>{
    const wd=weekdayOf(k);
    const peers=dates.filter(x=>weekdayOf(x)===wd&&!holidayFor(x));
    if(peers.length<4)return null;
    const avg=peers.reduce((a,x)=>a+S.sales[x],0)/peers.length;
    return avg>0?S.sales[k]/avg:null;
  }).filter(Boolean);
  if(!ratios.length)return null;
  return Math.round((ratios.reduce((a,b)=>a+b,0)/ratios.length)*100)/100;
}

/* ---------------- sales forecast + usage learning ---------------- */
function salesForecast(k){
  const wd=weekdayOf(k);
  const dates=Object.keys(S.sales).filter(x=>x<k&&weekdayOf(x)===wd&&!holidayFor(x)).sort().slice(-8);
  if(dates.length<2)return null;
  const base=dates.reduce((a,x)=>a+S.sales[x],0)/dates.length;
  const h=holidayFor(k);
  return {base,mult:h?(learnedMult(h)||h.mult):1,holiday:h,proj:base*(h?(learnedMult(h)||h.mult):1)};
}
/* usage for a past day: start + made - nextDayStart; needs both opening counts */
function usageLog(itemId){
  const keys=Object.keys(S.days).sort();
  const out=[];
  for(let i=0;i<keys.length-1;i++){
    const k=keys[i],k2=keys[i+1];
    const d1=new Date(k),d2=new Date(k2);
    if((d2-d1)/86400000!==1)continue; // must be consecutive
    const e1=S.days[k].entries.find(e=>e.itemId===itemId);
    const e2=S.days[k2].entries.find(e=>e.itemId===itemId);
    if(!e1||!e2||e1.current==null||e2.current==null)continue;
    const made=e1.status==='completed'?(e1.qty||0):0;
    const used=clamp0(e1.current+made-e2.current);
    out.push({day:k,used,sales:S.sales[k]||null});
  }
  return out;
}
function usageRate(itemId){ // units per $1000, recency-weighted
  const log=usageLog(itemId).filter(x=>x.sales&&x.sales>0).slice(-28);
  if(log.length<3)return null;
  let wsum=0,vsum=0;
  log.forEach((x,i)=>{const w=i+1;wsum+=w;vsum+=w*(x.used/(x.sales/1000));});
  return vsum/wsum;
}
function suggestedPar(itemId,k){
  const f=salesForecast(k), r=usageRate(itemId);
  if(!f||!r)return null;
  const it=item(itemId);
  let rec=f.proj/1000*r*1.1;
  if(it.batch>1)rec=Math.ceil(rec/it.batch)*it.batch; else rec=Math.ceil(rec);
  return {rec,proj:f.proj,rate:r};
}

function ensureToday(){
  const k=todayKey(), wd=weekdayOf(k);
  if(!S.days[k]){
    const h=holidayFor(k);
    const mult=h?(learnedMult(h)||h.mult):1;
    S.days[k]={entries:S.items.filter(i=>i.active).map(it=>{
      const base=it.par[wd];
      const par=h?Math.ceil(base*mult):base;
      return {id:uid(),itemId:it.id,par,parBase:base,override:null,holiday:h?{name:h.name,mult}:null,
        current:null,assignedTo:null,status:'not_started',emergency:false,
        startedAt:null,startedBy:null,completedAt:null,completedBy:null,late:false,qty:null,notes:''};
    }),clean:{},closed:false,closedBy:null,closedAt:null};
    if(h)log(`Holiday PARs applied: ${h.name} ×${mult}`);
    saveState();
  }
}
function today(){ensureToday();return S.days[todayKey()];}

/* ---------------- core calcs ---------------- */
function makeQty(e){ if(e.par<=0)return null; if(e.current==null)return undefined; return clamp0(e.par-e.current); }
function batchPlan(e){
  const it=item(e.itemId), mkq=makeQty(e);
  if(!mkq||!it.batch||it.batch<=1)return null;
  const n=Math.ceil(mkq/it.batch);
  return {n,expected:n*it.batch};
}
function dueTimeFor(e){const it=item(e.itemId);return (S.settings.dueTimes[it.shift]||'23:00');}
function isOverdue(e){
  if(e.status==='completed')return false;
  const mkq=makeQty(e); if(!mkq)return false;
  const [h,m]=dueTimeFor(e).split(':').map(Number);
  const now=new Date(); return now.getHours()*60+now.getMinutes()>h*60+m;
}
function statusOf(e){
  if(e.status==='completed')return {k:'done',label:'Complete',cls:'green'};
  if(e.par<=0)return {k:'nopar',label:'Needs PAR',cls:'gray'};
  if(isOverdue(e))return {k:'overdue',label:'Overdue',cls:'red'};
  if(e.status==='in_progress')return {k:'progress',label:'In progress',cls:'yellow'};
  if(makeQty(e)===0)return {k:'ok',label:'At PAR',cls:'green'};
  if(e.current==null)return {k:'count',label:'Count needed',cls:'yellow'};
  return {k:'todo',label:'Not started',cls:'gray'};
}

function dayStats(day){
  const es=day.entries.filter(e=>e.par>0);
  const done=es.filter(e=>e.status==='completed');
  const prog=es.filter(e=>e.status==='in_progress');
  const over=es.filter(isOverdue);
  const notStarted=es.filter(e=>e.status==='not_started'&&makeQty(e)!==0);
  const denom=done.length+prog.length+notStarted.length;
  const pct=denom?Math.round(done.length/denom*100):100;
  return {total:es.length,done:done.length,prog:prog.length,notStarted:notStarted.length,over:over.length,pct,late:done.filter(e=>e.late).length};
}

function viewReports(){
  const salesDays=Object.keys(S.sales).length;
  const rated=S.items.filter(i=>i.active&&usageRate(i.id));
  const wd=weekdayOf(todayKey());
  // suggestions for each item for the CURRENT weekday + Fri/Sat
  const targets=['mon','fri','sat'].includes(wd)?[wd,'fri','sat']:[wd,'fri','sat'];
  const uniq=[...new Set(targets)];
  const sugg=[];
  S.items.filter(i=>i.active).forEach(it=>{
    uniq.forEach(w=>{
      // fake a date key of the next occurrence of weekday w for forecast
      const d=new Date();const cur=d.getDay();const tgt=DAYS.indexOf(w);
      d.setDate(d.getDate()+((tgt-cur)+7)%7);
      const s=suggestedPar(it.id,ymd(d));
      if(!s)return;
      const curPar=it.par[w];
      if(curPar===0||Math.abs(s.rec-curPar)/Math.max(curPar,1)>=0.15)
        sugg.push({it,w,cur:curPar,rec:s.rec,proj:s.proj});
    });

  const days=rangeDays(ui.range).filter(k=>S.days[k]);
  const allE=days.flatMap(k=>S.days[k].entries);

      <button class="btn gold" style="width:100%;margin-top:10px" data-sheet="salesimport" data-id="">Import sales history</button>
    </div>
    ${rated.length?`<div class="sechead">Usage rates (per $1,000 sales)</div>
    <div class="card">${rated.map(it=>`<div class="row"><div class="t">${esc(it.name)}</div><div class="r">${(usageRate(it.id)).toFixed(2)} ${esc(it.unit)}</div></div>`).join('')}</div>`:''}
    <div class="sechead">Suggested PARs</div>
    <p style="font-size:14px;color:var(--txt3);margin-bottom:10px">Projected sales × usage rate × 10% buffer, rounded to batch size. Suggestions appear once sales history and daily counts build up. Nothing changes without approval.</p>
    ${sugg.length?`<button class="btn gold" style="width:100%;margin-bottom:10px" data-act="applyallsugg">Approve all — update every PAR from the data</button>`:''}
    <div class="card">${sugg.length?sugg.slice(0,12).map(s=>`
      <div class="row"><div><div class="t">${esc(s.it.name)} · ${DAYL[s.w]}</div><div class="s">Projected ${money0(s.proj)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="r">${s.cur||'—'} → <span style="color:var(--gold-lt)">${s.rec}</span></div>
          <button class="btn gold sm" data-act="applysugg" data-item="${s.it.id}" data-wd="${s.w}" data-rec="${s.rec}">Approve</button>
        </div></div>`).join(''):'<p class="notice">Not enough data yet. Import sales history and run daily counts for about a week.</p>'}
    </div>
    <div class="sechead">Holiday calendar</div>
    <div class="card">${S.holidays.map(h=>{const lm=learnedMult(h);return `<div class="row">
      <div><div class="t">${esc(h.name)}</div><div class="s">${h.type==='fixed'?`${h.m}/${h.d} every year`:h.type==='date'?esc(h.date):'floating date, auto'}</div></div>

function parseSalesCSV(text){
  const out={};let n=0;
  text.split(/\n+/).forEach(line=>{
    const parts=line.split(/[,\t;]+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2)return;
    let dstr=parts[0], sstr=parts[parts.length-1].replace(/[$,\s]/g,'');
    const amt=parseFloat(sstr); if(isNaN(amt)||amt<=0)return;
    let key=null;
    if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(dstr)){const [y,m,d]=dstr.split('-');key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    else if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(dstr)){
      const [m,d,y0]=dstr.split(/[\/\-]/);const y=y0.length===2?'20'+y0:y0;
      key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    if(!key)return;
    out[key]=amt;n++;
  });
  return {out,n};
}

            startedAt:e.started||null,startedBy:null,completedAt:e.completed||null,completedBy:userByName(e.by),
            late:!!e.late,qty:e.made??null,notes:e.notes||'',
            countLog:(e.counts||[]).map(c=>({t:c.t,v:c.v,by:userByName(c.by)}))};}).filter(Boolean);
        const clean={};Object.entries(day.cleaning||{}).forEach(([n,x])=>{clean[cleanByName(n)]={by:userByName(x.by),at:x.at};});
        S.days[k]={entries,clean,closed:!!day.closed,closedBy:null,closedAt:null};nd++;
      });
      if(Array.isArray(d.waste))d.waste.forEach(w=>{const it=byName(w.item);
        if(it&&!S.waste.some(x=>x.date===w.date&&x.itemId===it.id&&x.qty===w.qty))S.waste.push({id:uid(),date:w.date,time:'',itemId:it.id,qty:w.qty,reason:w.reason||'Other',by:userByName(w.by)});});
      if(Array.isArray(d.shortages))d.shortages.forEach(x=>{const it=byName(x.item);
        if(it)S.shortages.push({id:uid(),date:x.date,time:'',itemId:it.id,current:x.current,need:x.need,note:x.note||'',by:null,resolved:!!x.resolved});});
      log(`Restored from old app: ${nd} days, ${ns} sales entries`);
      saveState();closeSheet();render();toast(`✓ Restored ${nd} days of history`);
    }catch(e){toast('Restore hit an error — nothing was changed');}
  },
  copyexport(){const t=$('#f-export');t.select();t.setSelectionRange(0,99999999);
    try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied — paste it to Claude'));}
    catch(e){document.execCommand('copy');toast('Copied — paste it to Claude');}},
  saveuser(el){const id=el.dataset.id;const name=$('#f-name').value.trim();
    if(!name){toast('Name required');return;}
    if(id){user(id).name=name;log(`Edited cook ${name}`);}
    else{S.users.push({id:uid(),name});log(`Added cook ${name}`);}
    saveState();closeSheet();toast('Saved');},
  deluser(el){if(!confirm('Remove this cook?'))return;
    log(`Removed cook ${user(el.dataset.id)?.name}`);
    if(me.id===el.dataset.id)me=S.users.find(u=>u.id!==el.dataset.id)||me;
    S.users=S.users.filter(u=>u.id!==el.dataset.id);saveState();closeSheet();},
};

/* ---------------- binding ---------------- */
function bind(){
  document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{me=user(b.dataset.who)||me;closeSheet();});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ui.view=b.dataset.nav;render();});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ui.cat=b.dataset.cat;render();});
  document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ui.range=parseInt(b.dataset.range);render();});
  document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openSheet(b.dataset.sheet,b.dataset.id);});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();ACTIONS[b.dataset.act]?.(b);});
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    b.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));b.classList.add('on');});
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
    const i=b.parentElement.querySelector('input');i.value=clamp0((parseFloat(i.value)||0)+parseInt(b.dataset.step));});
  /* inline on-hand entry */
  document.querySelectorAll('[data-oh]').forEach(inp=>{
    inp.onclick=ev=>ev.stopPropagation();
    inp.onchange=()=>{
      const e=entryById(inp.dataset.oh);if(!e)return;
      const v=inp.value===''?null:clamp0(parseFloat(inp.value)||0);
      e.current=v;
      if(v!=null){e.countLog=e.countLog||[];e.countLog.push({t:new Date().toTimeString().slice(0,5),v,by:me.id});
        log(`Counted ${item(e.itemId).name}: ${v} in walk-in`);}
      saveState();render();
    };
  });
  const sw=$('.sheetwrap');if(sw)sw.onclick=ev=>{if(ev.target===sw)closeSheet();};
}

/* ---------------- migrations (run at boot and after every sync pull) ---------------- */
function migrate(){
  let merged=0;
  /* merge embedded sales history back in (stored state only carries diffs) */
  Object.keys(EMBEDDED_SALES).forEach(k=>{if(!(k in S.sales))S.sales[k]=EMBEDDED_SALES[k];});
  /* merge any newly added default holidays by name */
  defaultHolidays().forEach(h=>{if(!S.holidays.some(x=>x.name===h.name))S.holidays.push(h);});
  /* cleaning checklist migration */
  if(!S.cleanTasks){S.cleanTasks=defaultCleanTasks();merged++;}
  Object.values(S.days).forEach(d=>{if(!d.clean)d.clean={};});
  /* crew names */
  {const ren={'Cook 1':'Marcelino','Cook 2':'Juan','Cook 3':'Josue'};
   S.users.forEach(u=>{if(ren[u.name]){u.name=ren[u.name];merged++;}});
   ['Marcelino','Juan','Josue'].forEach(n=>{if(!S.users.some(u=>u.name===n)){S.users.push({id:uid(),name:n});merged++;}});}
  /* dough runs noon-to-noon: midday shift, counted before the make */
  {const d=S.items.find(i=>i.name==='Dough');if(d&&d.shift!=='Midday'){d.shift='Midday';merged++;}
   if(S.settings.dueTimes.Midday!=='13:00'){S.settings.dueTimes.Midday='13:00';merged++;}}
  /* apply Imran's PAR list to items still at zero */
  S.items.forEach(it=>{const pl=PRELOADED_PARS[it.name];
    if(pl&&Object.values(it.par).every(v=>!v)){
      it.par={mon:pl.p[0],tue:pl.p[1],wed:pl.p[2],thu:pl.p[3],fri:pl.p[4],sat:pl.p[5],sun:pl.p[6]};
      it.unit=pl.u;it.batch=pl.b;if(pl.n)it.name=pl.n;merged++;}});
  /* v7: Garlic Bread joins Kitchen — set its PARs in Setup */
  if(!S.items.some(i=>i.name==='Garlic Bread')){
    const it={id:uid(),demo:false,name:'Garlic Bread',cat:'Kitchen',unit:'loaves',
      par:{mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0},batch:1,shelf:'',station:'Kitchen',
      shift:'Opening',prio:'normal',prepMin:15,cost:0,active:true,notes:''};
    S.items.push(it);merged++;
    const gk=todayKey();
    if(S.days[gk]&&!S.days[gk].closed)S.days[gk].entries.push({id:uid(),itemId:it.id,par:0,parBase:0,override:null,holiday:null,current:null,assignedTo:null,status:'not_started',emergency:false,startedAt:null,startedBy:null,completedAt:null,completedBy:null,late:false,qty:null,notes:''});
  }
  /* refresh today's open entries that had no PAR */
  const tk=todayKey();
  if(S.days[tk]&&!S.days[tk].closed){
    const wd=weekdayOf(tk),h=holidayFor(tk),mult=h?(learnedMult(h)||h.mult):1;
    S.days[tk].entries.forEach(e=>{
      if(e.par===0&&e.status!=='completed'&&!e.override){
        const it=item(e.itemId);
        if(it&&it.par[wd]>0){e.parBase=it.par[wd];e.par=h?Math.ceil(it.par[wd]*mult):it.par[wd];}
      }});
  }
  return merged;
}

/* ---------------- boot ---------------- */
(async function(){
  render();
  const loaded=await loadState();
  S=loaded||seed();
  const merged=migrate();
  if(!loaded||merged)saveState();
  me=S.users[0]||{id:'crew',name:'Crew'};
  ensureToday();
  render();
  setInterval(syncPull,20000);
  liveSync();
  if(fsOnline===false){
    const b=document.createElement('div');b.id='offlineBanner';
    b.style.cssText='position:sticky;top:0;z-index:999;background:#8a6d1a;color:#fff;font-size:11px;padding:5px 10px;text-align:center;font-weight:600';
    b.textContent='No connection — saving on this phone, will sync when back online.';
    document.body.prepend(b);
    const watch=setInterval(()=>{if(fsOnline){clearInterval(watch);const x=document.getElementById('offlineBanner');if(x)x.remove();toast('✓ Back in sync');}},5000);
  }
})();
</script>
